<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
<title>Gacha Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="sidebar">
  <div class="brand"><img src="icon.png" alt=""><span>Gacha Tracker</span></div>
  <nav id="nav"></nav>
  <div class="side-foot">
    <button class="ghost" data-view="settings" id="nav-settings">⚙️ Settings</button>
    <div class="updated"><span id="updated">Loading…</span>
      <button class="icon-btn" id="refresh" title="Refresh now">⟳</button></div>
  </div>
</aside>
<main id="view"><div class="loading"><div class="spinner"></div><p>Fetching the latest events…</p></div></main>
<div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
